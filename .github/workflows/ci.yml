name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: helio
          POSTGRES_PASSWORD: helio
          POSTGRES_DB: helio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U helio -d helio_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      ENV: test
      DATABASE_URL: postgresql+psycopg://helio:helio@localhost:5432/helio_test
      TEST_DATABASE_URL: postgresql+psycopg://helio:helio@localhost:5432/helio_test
      JWT_SECRET: ci-only-not-a-secret-padded-to-32-bytes
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q --cov=app --cov-report=term-missing:skip-covered

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      BACKEND_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:i18n
      - run: npm run build

  # The whole journey (ARCHITECTURE §15.4) on a fresh database, through a production build.
  # AI_MODE=demo with no keys: only the bundled synthetic sample bill is read; no live AI calls.
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: helio
          POSTGRES_PASSWORD: helio
          POSTGRES_DB: helio_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U helio -d helio_e2e"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      CI: "true"
      DATABASE_URL: postgresql+psycopg://helio:helio@localhost:5432/helio_e2e
      E2E_DATABASE_URL: postgresql+psycopg://helio:helio@localhost:5432/helio_e2e
      SEED_DEMO_PASSWORD: ci-e2e-staff-password-2026
      JWT_SECRET: ci-only-not-a-secret-padded-to-32-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Migrate and seed an empty database
        working-directory: backend
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          uv run python -m seed
      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: frontend
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
