# Render blueprint for the HelioFlow API (ARCHITECTURE §16). Steps: docs/deployment.md.
# Secrets are never in this file: `sync: false` values are entered in the Render dashboard,
# and JWT_SECRET is generated by Render.
services:
  - type: web
    name: helioflow-api
    runtime: python
    rootDir: backend
    plan: free
    region: singapore # closest Render region to Nagpur
    buildCommand: pip install uv && uv sync --frozen --no-dev
    # Migrations are idempotent and run on every start; the seed is run once, by hand (deployment.md).
    startCommand: uv run --no-sync alembic upgrade head && uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: ENV
        value: production
      - key: DATABASE_URL # Neon connection string (postgresql://… is accepted as pasted)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL_HOURS
        value: "8"
      - key: FRONTEND_ORIGIN # the Vercel URL, e.g. https://helioflow.vercel.app
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY_HEADERS # requests arrive through Vercel's proxy
        value: "true"
      - key: AI_MODE
        value: live
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_TIMEOUT_SECONDS
        value: "20"
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: DEMO_LOGINS # "true" shows one-click role sign-in for reviewers; leave blank to hide it
        sync: false
